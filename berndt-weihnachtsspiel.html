<style>

  .qst{font-size:13px;color:#ffd98a;margin-top:4px}
  #minigame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#101c33f5;border:2px solid #5b83c9;

  #minigame .mgbtns{margin-top:12px;display:flex;gap:8px;justify-content:center}
  #minigame button.act{background:#3d7a5f;border:none;color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
  #minigame button.close{background:#41341f;border:1px solid #a8874f;color:#ffd98a;border-radius:8px;padding:6px 14px;cursor:pointer}
  #minigame canvas{border-radius:8px;cursor:pointer}
  .orgpipe{width:46px;height:120px;margin:4px;border:none;border-radius:10px 10px 4px 4px;cursor:pointer;font-size:22px;color:#0009}

  .wishopt{display:block;width:320px;margin:6px auto;background:#1c3050;border:1px solid #4a6da0;color:#eaf2ff;border-radius:8px;padding:8px;cursor:pointer;font-size:14px}

  .wishopt.sel{background:#3d6a3f;border-color:#8fd08f}
  #toasts{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center}
  .toast{display:inline-block;background:#132241e8;border:1px solid #c9a15a;color:#ffe9b0;padding:8px 16px;border-radius:10px;
    margin-top:6px;font-size:14px;animation:tfade 3.2s forwards}
  @keyframes tfade{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

<script>
'use strict';
const W=960,H=600,cv=document.getElementById('game'),ctx=cv.getContext('2d');
const PHASE_LEN=120,DAY_LEN=240,SPEEDS=[1,5,15];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastBox=document.getElementById('toasts');
function toast(msg){const d=document.createElement('div');d.className='toast';d.innerHTML=msg;toastBox.appendChild(d);setTimeout(()=>d.remove(),3300)}
let audioCtx=null;
function beep(freq,dur,type){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=0.06;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(dur||0.15));o.stop(audioCtx.currentTime+(dur||0.15))}catch(e){}}

const MUSIC={on:false,step:0,timer:0,
 MEL:[[659,.25],[659,.25],[659,.5],[659,.25],[659,.25],[659,.5],[659,.25],[784,.25],[523,.25],[587,.25],[659,.9],[0,.15],
      [587,.25],[587,.25],[784,.25],[659,.25],[784,.25],[880,.5],[554,.25],[784,.25],[659,.25],[587,.25],[523,1],[0,.35]],
 start(){if(this.on)return;this.on=true;this.timer=setInterval(()=>this.tick(),140)},
 stop(){this.on=false;clearInterval(this.timer)},
 tick(){const c=this.MEL[this.step%this.MEL.length];if(c[0]>0)beep(c[0],Math.max(0.12,c[1]*0.9),'triangle');if(this.step%2===0)beep(2400,0.03,'square');this.step++}};
function toggleMusic(){if(!MUSIC.on){MUSIC.start();document.getElementById('btnMusic').textContent='\U0001F50A Musik: an';toast('\U0001F3B5 Jingle Bells l\u00e4uft!')}else{MUSIC.stop();document.getElementById('btnMusic').textContent='\U0001F507 Musik: aus'}}

const ITEMS={
  lichtkette:{name:'Lichterkette',col:'#ffd34d',stack:true},
  schaufel:{name:'Schneeschaufel',col:'#9fb6cc',stack:false},
  werkzeug:{name:'Werkzeugkiste',col:'#cc7a3d',stack:false},
  lupe:{name:'Lupe',col:'#7fd8e8',stack:false},
  kugel:{name:'Christbaumkugel',col:'#e05a6b',stack:true},
  glocke:{name:'Weihnachtsglocke',col:'#e8c04a',stack:false},

const inv={};for(const k in ITEMS)inv[k]=0;

const QUESTS=[
 {id:'beleuchtung',main:true,title:'Weihnachtsbeleuchtung im ganzen Dorf',
  steps:['Angeblich liegen wohl Lichterketten im ganzen Dorf verstreut – Stall SSE, Haus, Keller, Kirche & Bahnhof locken.','Auf dem Bahnhofsgelände muss es einen alten Stromkasten geben – der Kasten außen rechts wirkt verdächtig.','Schalte im Stromkasten die Beleuchtung fürs ganze Dorf ein.']},
 {id:'schaufeln',main:true,title:'Schneeschaufeln auf dem Kirchweg',

 {id:'orgel',main:true,title:'Orgel in der Kirche reparieren',
  steps:['Ohne Werkzeug geht da nichts – sowas liegt sicher irgendwo rum, vielleicht im Keller.','Spiel die Melodie der Orgel nach, damit sie wieder klingt.']},
 {id:'zettel',main:true,title:'5 Wunschzettel aus 5 Gärten',counter:{item:'wunschzettel',need:5,hint:'Suche in 5 Gärten des Dorfes (je Haus einer!)'},
  steps:['In den Gärten von 5 verschiedenen Häusern wehen Wunschzettel durch den Schnee.','Bring alle Wunschzettel zum Postkasten am Bahnhof – da, wo der gelbe Briefkasten steht.']},

 {id:'katze',main:false,title:'Spielzeugmaus für den Kater',
  steps:['Unter dem Sofa im Wohnzimmer versteckt sich eine Spielzeugmaus.','Gib dem Kater vor OGFLUR die Maus – er wird 60 Sekunden tief und fest schlafen.']}
];
const Q={};for(const q of QUESTS)Q[q.id]={st:'offer',step:0};
let G={screen:'title',time:0,speed:1,susp:0,map:'dorf',px:1050,py:640,flags:{},katzeSleep:0,portalCd:0,msg:''};
const day=()=>1+Math.floor(G.time/DAY_LEN);
const isNight=()=>(G.time%DAY_LEN)>=PHASE_LEN;
const phaseName=()=>['Morgen','Tag','Abend','Nacht'][Math.floor((G.time%DAY_LEN)/60)];
const keys={};let mouse={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;
  if(G.screen!=='play')return;
  if(e.key.toLowerCase()==='q')toggleQuests();
  if(e.key.toLowerCase()==='e')tryInteract();
  if(e.key>='1'&&e.key<='8')toggleItem(+e.key-1)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
function addInv(id,n){inv[id]=(inv[id]||0)+n;beep(660,0.12,'triangle');const it=ITEMS[id];toast('\u2728 '+it.name+(n>1?' ×'+n:'')+' aufgehoben!')}
function drawRR(g,x,y,w,h,r,fill,stroke){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function drawTanne(g,x,y,s,gcol){s=s||1;g.fillStyle='#4a3524';g.fillRect(x-3*s,y-2,6*s,10*s);g.fillStyle=gcol||'#2e6b45';for(let i=0;i<3;i++){const w=(30-i*8)*s,hh=16*s,yy=y-8*s-i*13*s;g.beginPath();g.moveTo(x-w/2,yy);g.lineTo(x,yy-hh);g.lineTo(x+w/2,yy);g.closePath();g.fill()}
 g.fillStyle='#ffffffcc';g.beginPath();g.moveTo(x-8*s,y-26*s);g.lineTo(x,y-34*s);g.lineTo(x+8*s,y-26*s);g.closePath();g.fill()}
function drawLampP(g,x,y,lit){g.fillStyle='#3a3f4a';g.fillRect(x-3,y-56,6,52);g.fillRect(x-8,y-4,16,5);drawRR(g,x-8,y-72,16,18,4,lit?'#ffe9a0':'#4b5566');
 if(lit){const gr=g.createRadialGradient(x,y-64,4,x,y-64,52);gr.addColorStop(0,'rgba(255,220,120,.55)');gr.addColorStop(1,'rgba(255,220,120,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y-64,52,0,7);g.fill()}}
function drawWindow(g,x,y,w,h,gold){g.fillStyle=gold?'#ffd98a':'#22314d';g.fillRect(x,y,w,h);g.strokeStyle='#d8cfc0';g.lineWidth=2;g.strokeRect(x,y,w,h);g.beginPath();g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+h);g.moveTo(x,y+h/2);g.lineTo(x+w,y+h/2);g.stroke()}
function drawHuman(g,x,y,c1,c2,skin,walk,zzz){const b=Math.sin(walk*0.25)*2;g.fillStyle='#222b3a';g.beginPath();g.ellipse(x,y+2,9,4,0,0,7);g.fill();
 g.fillStyle=c2;g.fillRect(x-5,y-6+b*0.5,4,10+b);g.fillRect(x+1,y-6-b*0.5,4,10-b);
 g.fillStyle=c1;drawRR(g,x-7,y-18,14,15,5,c1);g.fillStyle=skin||'#e8b99a';g.beginPath();g.arc(x,y-23+b,6,0,7);g.fill();
 g.fillStyle='#3a2c22';g.beginPath();g.arc(x,y-26+b,5.5,Math.PI,0);g.fill();
 g.fillStyle='#000';g.beginPath();g.arc(x-2,y-23+b,1,0,7);g.arc(x+2,y-23+b,1,0,7);g.fill();
 if(zzz){g.fillStyle='#cfe0ff';g.font='11px sans-serif';g.fillText('zZ',x+8,y-28+b)}}
function drawElf(g,x,y,walk){const b=Math.sin(walk*0.3)*2.2;g.fillStyle='#1c4a2e';
 g.beginPath();g.ellipse(x,y+2,7,3,0,0,7);g.fill();
 g.fillStyle='#2e6b3f';g.fillRect(x-4,y-5+b*0.4,3.5,8);g.fillRect(x+0.5,y-5-b*0.4,3.5,8);
 g.fillStyle='#3f8a52';drawRR(g,x-6,y-15,12,12,4,'#3f8a52');g.fillStyle='#e8c04a';g.fillRect(x-6,y-8,12,2);
 g.fillStyle='#e8b99a';g.beginPath();g.arc(x,y-19+b,5,0,7);g.fill();
 g.beginPath();g.moveTo(x-4,y-21+b);g.lineTo(x,y-32+b);g.lineTo(x+4,y-21+b);g.closePath();g.fillStyle='#c92f2f';g.fill();g.fillStyle='#f4f0e0';g.beginPath();g.arc(x,y-31+b,2,0,7);g.fill();
 g.fillStyle='#000';g.beginPath();g.arc(x-1.8,y-19+b,0.9,0,7);g.arc(x+1.8,y-19+b,0.9,0,7);g.fill()}
function drawCat(g,x,y,walk,zzz){g.fillStyle='#7a6a58';g.beginPath();g.ellipse(x,y,12,6,0,0,7);g.fill();g.beginPath();g.arc(x+11,y-4,5,0,7);g.fill();
 g.beginPath();g.moveTo(x+8,y-8);g.lineTo(x+9,y-13);g.lineTo(x+12,y-8);g.moveTo(x+13,y-8);g.lineTo(x+14,y-13);g.lineTo(x+16,y-8);g.fill();g.fillStyle='#7a6a58';g.fill();
 g.fillStyle='#c8f';const tl=Math.sin(walk*0.15)*6;g.beginPath();g.moveTo(x-11,y);g.quadraticCurveTo(x-18,y-6+tl,x-16,y+2);g.lineTo(x-11,y+2);g.fill();
 if(zzz){g.fillStyle='#cfe0ff';g.beginPath();g.arc(x+11,y-4,1,0,7);g.arc(x+13,y-4,1,0,7);g.fill()}}
function drawDog(g,x,y,walk){g.fillStyle='#8a6a4a';g.beginPath();g.ellipse(x,y,14,7,0,0,7);g.fill();g.beginPath();g.arc(x+13,y-6,6,0,7);g.fill();
 g.fillStyle='#6a4c30';g.beginPath();g.ellipse(x-4,y-2,7,4,0,0,7);g.fill();
 g.beginPath();g.moveTo(x+9,y-12);g.lineTo(x+9,y-6);g.lineTo(x+14,y-6);g.lineTo(x+12,y-12);g.fill();g.fillStyle='#c93';const tl=Math.sin(walk*0.3)*5;g.fillRect(x-18,y-6+tl*0.4,4,10)}
function drawBird(g,x,y,walk){g.fillStyle='#8899aa';g.beginPath();g.ellipse(x,y,6,4,0,0,7);g.fill();g.beginPath();g.arc(x+5,y-3,3,0,7);g.fill();g.fillStyle='#e8a03d';g.beginPath();g.moveTo(x+8,y-3);g.lineTo(x+11,y-2);g.lineTo(x+8,y-1);g.fill();if(Math.sin(walk*0.3)>0.7){g.fillStyle='#8899aa';g.fillRect(x-2,y+2,2,4)}}
