<!DOCTYPE html>
<html lang="de">
<head>

<title>Berndt – Der Weihnachts-Wichtel</title>
<style>

  #minigame button.act{background:#3d7a5f;border:none;color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
  #minigame button.close{background:#41341f;border:1px solid #a8874f;color:#ffd98a;border-radius:8px;padding:6px 14px;cursor:pointer}
  #minigame canvas{border-radius:8px;cursor:pointer}
  .orgpipe{width:46px;height:120px;margin:4px;border:none;border-radius:10px 10px 4px 4px;cursor:pointer;font-size:22px;color:#0009}
  .orgpipe.flash{outline:4px solid #fff}
  .wishopt{display:block;width:320px;margin:6px auto;background:#1c3050;border:1px solid #4a6da0;color:#eaf2ff;border-radius:8px;padding:8px;cursor:pointer;font-size:14px}
  .wishopt:hover{background:#2a4770}

  #toasts{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center}
  .toast{display:inline-block;background:#132241e8;border:1px solid #c9a15a;color:#ffe9b0;padding:8px 16px;border-radius:10px;
    margin-top:6px;font-size:14px;animation:tfade 3.2s forwards}
  @keyframes tfade{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #loadfile{display:none}

#mapPanel{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:26;display:none;border:2px solid #c9a15a;border-radius:12px;background:#14204aaa;padding:6px;backdrop-filter:blur(2px)}
#mapcv{display:block;border-radius:8px}
.qclose{display:block;margin:0 auto 6px;background:#3a2c14;border:1px solid #c9a15a;color:#ffd98a;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}

<script>
'use strict';
const W=960,H=600,cv=document.getElementById('game'),ctx=cv.getContext('2d');
const PHASE_LEN=60,DAY_LEN=120,SPEEDS=[1,5,15];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastBox=document.getElementById('toasts');
const SFX={ac:null};function sfxA(){if(!SFX.ac){try{SFX.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return SFX.ac}
function sfxTone(f,dur,type,vol,when){const a=sfxA();if(!a)return;const t0=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur)}
function sfxDoor(){sfxTone(150,0.25,'sawtooth',0.05);sfxTone(96,0.2,'sawtooth',0.045,0.13);sfxTone(420,0.07,'square',0.03,0.3)}
function sfxAlert(){sfxTone(880,0.07,'square',0.05);sfxTone(660,0.09,'square',0.05,0.08)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>sfxTone(f,0.18,'triangle',0.06,i*0.13))}
function toast(msg){const d=document.createElement('div');d.className='toast';d.innerHTML=msg;toastBox.appendChild(d);setTimeout(()=>d.remove(),3300)}
let audioCtx=null;
function beep(freq,dur,type){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=0.06;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(dur||0.15));o.stop(audioCtx.currentTime+(dur||0.15))}catch(e){}}

const MUSIC={on:false,step:0,timer:0,
 MEL:[[659,.25],[659,.25],[659,.5],[659,.25],[659,.25],[659,.5],[659,.25],[784,.25],[523,.25],[587,.25],[659,.9],[0,.15],
      [587,.25],[587,.25],[784,.25],[659,.25],[784,.25],[880,.5],[554,.25],[784,.25],[659,.25],[587,.25],[523,1],[0,.35]],
 start(){if(this.on)return;this.on=true;this.timer=setInterval(()=>this.tick(),140)},
 stop(){this.on=false;clearInterval(this.timer)},
 tick(){const c=this.MEL[this.step%this.MEL.length];if(c[0]>0)beep(c[0],Math.max(0.12,c[1]*0.9),'triangle');if(this.step%2===0)beep(2400,0.03,'square');this.step++}};
function toggleMusic(){if(!MUSIC.on){MUSIC.start();document.getElementById('btnMusic').textContent='\U0001F50A Musik: an';toast('\U0001F3B5 Jingle Bells l\u00e4uft!')}else{MUSIC.stop();document.getElementById('btnMusic').textContent='\U0001F507 Musik: aus'}}

const ITEMS={
  lichtkette:{name:'Lichterkette',col:'#ffd34d',stack:true},
  schaufel:{name:'Schneeschaufel',col:'#9fb6cc',stack:false},
  werkzeug:{name:'Werkzeugkiste',col:'#cc7a3d',stack:false},
  lupe:{name:'Lupe',col:'#7fd8e8',stack:false},
  kugel:{name:'Christbaumkugel',col:'#e05a6b',stack:true},
  glocke:{name:'Weihnachtsglocke',col:'#e8c04a',stack:false},
  kerze:{name:'Kerze',col:'#ffb56b',stack:true},
  ast:{name:'Tannenast',col:'#3f7d4a',stack:false},
  kohle:{name:'Kohle',col:'#555a63',stack:true},
  brief:{name:'Weihnachtsbrief',col:'#f5efdd',stack:false},
  stempel:{name:'Siegelstempel',col:'#a34a5a',stack:false},
  zimt:{name:'Zimtstange',col:'#9a6b3f',stack:true},
  maus:{name:'Spielzeugmaus',col:'#c8c0d8',stack:false},
  mandarine:{name:'Mandarine',col:'#ff9a3d',stack:true},
  wunschzettel:{name:'Wunschzettel',col:'#fdf6e0',stack:true},
  kristall:{name:'Eiskristall',col:'#bfe8ff',stack:true},
  mütze:{name:'Wollmütze',col:'#5aa0d8',stack:false},

};
const inv={};for(const k in ITEMS)inv[k]=0;

const QUESTS=[
 {id:'beleuchtung',main:true,title:'Weihnachtsbeleuchtung im ganzen Dorf',
  steps:['Angeblich liegen wohl Lichterketten im ganzen Dorf verstreut – Scheune, Haus, Keller, Kirche & Bahnhof locken.','Auf dem Bahnhofsgelände muss es einen alten Stromkasten geben – der Kasten außen rechts wirkt verdächtig.','Schalte im Stromkasten die Beleuchtung fürs ganze Dorf ein.']},
 {id:'schaufeln',main:true,title:'Schneeschaufeln auf dem Kirchweg',
  steps:['Eine Schneeschaufel soll es im Depot am Bahnhof geben – oder unten im Keller.','Nimm die Schaufel und schaufle den verschneiten Kirchweg frei.']},
 {id:'orgel',main:true,title:'Orgel in der Kirche reparieren',
  steps:['Ohne Werkzeug geht da nichts – sowas liegt sicher irgendwo rum, vielleicht im Keller.','Spiel die Melodie der Orgel nach, damit sie wieder klingt.']},
 {id:'zettel',main:true,title:'5 Wunschzettel aus 5 Gärten',counter:{item:'wunschzettel',need:5,hint:'Suche in 5 Gärten des Dorfes (je Haus einer!)'},
  steps:['In den Gärten von 5 verschiedenen Häusern wehen Wunschzettel durch den Schnee.','Bring alle Wunschzettel zum Postkasten am Bahnhof – da, wo der gelbe Briefkasten steht.']},
 {id:'baum',main:false,title:'Den Weihnachtsbaum schmücken',
  steps:['Eine Christbaumkugel soll in der Spielzeugkiste im Kinderzimmer liegen und eine Glocke im Laden.','Schmücke im Wohnzimmer den Weihnachtsbaum, wenn keiner hinsieht.']},
 {id:'kranz',main:false,title:'Adventskranz anzünden',
  steps:['Sammle 4 Kerzen (Laden, Wohnzimmer, Kinderzimmer, Bad).','Zünde den Adventskranz in der Küche Kerze für Kerze in richtiger Reihenfolge an.']},
 {id:'schneemann',main:false,title:'Schneemann im Garten bauen',
  steps:['Ein Tannenast versteckt sich in den Gärten, Kohle liegt im Keller.','Baue im Garten von Haus Lehmann (rechts unten) den Schneemann auf.']},
 {id:'brief',main:false,title:'Weihnachtsbrief schreiben',
  steps:['Ein Briefpapier und ein Siegelstempel – beides soll im Laden zu finden sein.','Wähle am Schreibtisch im Wohnzimmer einen Wunsch und versiegele den Brief.','Wirf den fertigen Brief in den Postkasten am Bahnhof.']},
 {id:'glitzer',main:false,title:'Glitzer im Schnee',counter:{item:'kristall',need:3,hint:'Kristalle sind nur mit der Lupe sichtbar'},
  steps:['Besorge eine Lupe – vielleicht liegt die auf einem Nachttisch.','Mit der Lupe erscheinen im Garten von Haus Berndt Eiskristalle. Sammle 3.']},
 {id:'nikolaus',main:false,title:'Nacht des Nikolaus (Tag 6)',
  steps:['Warte bis zur Nacht vom 5. auf den 6. Tag (⏩-Knopf hilft) und bleib im Versteck.','Sobald der Nikolaus da war: Sammle die Mandarinen im Kinderzimmer.']},
 {id:'zimt',main:false,title:'Zimt für Omas Plätzchen',
  steps:['Eine Zimtstange muss im Küchenregal liegen – ausgerechnet, wenn Mama weg ist.','Gib Oma die Zimtstange – sprich sie an, wenn du nahe genug bist.']},
 {id:'katze',main:false,title:'Spielzeugmaus für den Kater',
  steps:['Unter dem Sofa im Wohnzimmer versteckt sich eine Spielzeugmaus.','Gib dem Kater vor OGFLUR die Maus – er wird 60 Sekunden tief und fest schlafen.']},
 {id:'streuner',main:false,title:'Streunerkatze Mimi zaehmen'.replace('zaehmen','z\u00e4hmen'),
  steps:['Eine scheue Streunerkatze streicht um den zugefrorenen See \u2013 Fisch mag sie am liebsten, Fleisch geht zur Not.','Sprich Mimi am Eissee an und gib ihr etwas zu fressen \u2013 dann folgt sie dir auf Schritt und Tritt.']}
];
const Q={};for(const q of QUESTS)Q[q.id]={st:'offer',step:0};
let G={screen:'title',time:0,speed:1,susp:0,map:'dorf',px:1050,py:640,flags:{},katzeSleep:0,portalCd:0,msg:''};
const day=()=>1+Math.floor(G.time/DAY_LEN);
let TRAIN={y:-1400,dir:1,wait:14};
function updateTrain(dt){if(TRAIN.wait>0){TRAIN.wait-=dt;return}TRAIN.y+=TRAIN.dir*820*dt;
 if(G.map==='dorf'&&G.px>82&&G.px<268){for(let i=0;i<5;i++){const wy=TRAIN.y-TRAIN.dir*86*i;if(Math.abs(wy-G.py)<64){G.screen='lose';G.loseWhy='Die S1 hat dich mitgenommen \u2013 geh nicht auf die Gleise!';beep(160,0.5,'sawtooth');return}}}
 if(TRAIN.dir>0&&TRAIN.y>3300){TRAIN.dir=-1;TRAIN.wait=114}if(TRAIN.dir<0&&TRAIN.y<-1400){TRAIN.dir=1;TRAIN.wait=114}}
function drawTrain(g){if(TRAIN.wait>0)return;const x=176;for(let i=0;i<5;i++){const wy=TRAIN.y-TRAIN.dir*86*i;if(wy<-120||wy>2320)continue;g.fillStyle='#c43a2a';g.fillRect(x-34,wy-32,68,64);g.fillStyle='#ffd34d';g.fillRect(x-34,wy-8,68,8);g.fillStyle='#222b3a';g.fillRect(x-34,wy-32,68,6);g.fillStyle='#ffd98a';g.fillRect(x-26,wy-22,18,14);g.fillRect(x+8,wy-22,18,14);g.fillRect(x-26,wy+2,18,14);g.fillRect(x+8,wy+2,18,14);g.fillStyle='#3a3f4a';g.fillRect(x-34,wy+24,68,8);if(i===0){g.fillStyle='#ffd34d';g.fillRect(x-14,wy+(TRAIN.dir>0?30:-38),28,8)}}g.fillStyle='rgba(255,220,120,.35)';g.beginPath();g.arc(x,TRAIN.y+TRAIN.dir*46,26,0,7);g.fill()}
let FP={x:0,y:0,walk:0,init:false};
function updateFollow(dt){if(!G.flags.katzeZahm)return;if(!FP.init){FP.x=G.px-22;FP.y=G.py;FP.init=true}
 const dx=G.px-FP.x,dy=G.py-FP.y,d=Math.hypot(dx,dy);if(d>280){FP.x=G.px;FP.y=G.py;FP.init=true;return}
 if(d>25){const sp=Math.min(d*3.5,330);FP.x+=dx/d*sp*dt;FP.y+=dy/d*sp*dt;FP.walk+=dt*14}}
function drawFollowCat(g){g.save();g.translate(FP.x,FP.y);g.scale(0.8,0.8);drawCat(g,0,0,FP.walk,false);g.restore()}
function tameAttempt(){if(G.flags.katzeZahm){toast('\ud83d\udc31 Mimi schnurrt zufrieden und bleibt an deiner Seite!');return}
 if(inv.fisch){inv.fisch--;G.flags.katzeZahm=true;FP.init=false;toast('\ud83d\udc1f Mimi liebt den Fisch! Sie ist gez\u00e4hmt und folgt dir jetzt \u00fcberall hin.');if(Q.streuner.st==='active')finQ('streuner');beep(660,0.2,'sine');return}
 if(inv.fleisch){inv.fleisch--;G.flags.katzeZahm=true;FP.init=false;toast('\ud83e\udd69 Mimi schnappt sich das Fleisch! Sie ist gez\u00e4hmt und folgt dir jetzt.');if(Q.streuner.st==='active')finQ('streuner');beep(660,0.2,'sine');return}
 toast('Mimi miaut hungrig \u2013 bring ihr einen Fisch (lieber!) oder Fleisch mit. (Q: Nebenaufgabe)')}
const isNight=()=>(G.time%DAY_LEN)>=PHASE_LEN;
const phaseName=()=>['Morgen','Tag','Abend','Nacht'][Math.floor((G.time%DAY_LEN)/30)];
const keys={};let mouse={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;
  if(G.screen==='intro'){if((e.key===' '||e.key==='w'||e.key==='W'||e.key==='ArrowUp')&&G.introRoof&&!G.introRoof.dead&&!G.introRoof.done){G.introRoof.vy=-560;if(e.preventDefault)e.preventDefault();return}if(e.key===' '&&e.preventDefault)e.preventDefault();finishIntro();G.introT=99;return}
  if(G.screen!=='play')return;
  if(e.key.toLowerCase()==='q')toggleQuests();
 if(e.key==='Escape'){const qp=document.getElementById('questPanel');if(qp.style.display==='block'){toggleQuests()}else if(document.getElementById('minigame').style.display==='block'){closeMG()}else if(mapOn)toggleMap()}
 if(e.key.toLowerCase()==='m')toggleMap();
  if(e.key.toLowerCase()==='e')tryInteract();
  if(e.key>='1'&&e.key<='9')toggleItem(+e.key-1);if(e.key==='0')toggleItem(9)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
cv.addEventListener('mousedown',e=>{if(G.screen!=='play')return;const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;const hy2=H-58;const nx=Object.keys(ITEMS).length;
 if(mx>=8&&mx<=8+46*nx&&my>=hy2-14&&my<=hy2+34){const si=Math.floor((mx-8)/46);const owned=Object.keys(ITEMS).filter(k=>inv[k]>0);if(si>=0&&si<owned.length){toggleItem(si);if(e.preventDefault)e.preventDefault()}}});
function addInv(id,n){inv[id]=(inv[id]||0)+n;beep(660,0.12,'triangle');const it=ITEMS[id];toast('\u2728 '+it.name+(n>1?' ×'+n:'')+' aufgehoben!')}
function drawRR(g,x,y,w,h,r,fill,stroke){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function drawTanne(g,x,y,s,gcol){
 s=s||1;
 g.fillStyle='rgba(30,50,80,.18)';g.beginPath();g.ellipse(x+3*s,y+7,16*s,6*s,0,0,7);g.fill();
 g.fillStyle='#4a3524';g.fillRect(x-2.2*s,y-1*s,4.4*s,11*s);
 g.beginPath();g.moveTo(x-6*s,y+9.5*s);g.lineTo(x-2.2*s,y+4*s);g.lineTo(x-2.2*s,y+9.5*s);g.closePath();g.fill();
 g.beginPath();g.moveTo(x+6*s,y+9.5*s);g.lineTo(x+2.2*s,y+4*s);g.lineTo(x+2.2*s,y+9.5*s);g.closePath();g.fill();
 for(let i=3;i>=0;i--){
  const w=(8+i*5.6)*s, ty=y-(20+i*8)*s, by=y-(6+i*8)*s;
  g.fillStyle=i%2?'#2a5f3c':(gcol||'#2e6b45');
  g.beginPath();g.moveTo(x,ty);g.lineTo(x+w,by);
  g.quadraticCurveTo(x+w*0.45,by+3*s,x,by);g.quadraticCurveTo(x-w*0.45,by+3*s,x-w,by);
  g.closePath();g.fill();
 }
 g.fillStyle='rgba(244,248,255,.92)';
 for(let i=3;i>=1;i--){
  const w=(8+i*5.6)*s, ty=y-(20+i*8)*s, by=y-(6+i*8)*s;
  g.beginPath();g.moveTo(x,ty+1.5*s);g.lineTo(x+w*0.52,by-6*s);
  g.quadraticCurveTo(x,by-1.5*s,x-w*0.52,by-6*s);g.closePath();g.fill();
 }
 g.fillStyle='#f4f8ff';g.beginPath();g.moveTo(x-3*s,y-46*s);g.lineTo(x,y-52*s);g.lineTo(x+3*s,y-46*s);g.closePath();g.fill();
}
function drawLampP(g,x,y,lit){
 g.fillStyle='#262b33';g.fillRect(x-3.4,y-56,6.8,52);
 g.fillStyle='#3d444f';g.fillRect(x-3.4,y-56,2.2,52);
 g.fillStyle='#262b33';g.fillRect(x-9.5,y-5,19,5);g.fillRect(x-4.6,y-38,9.2,3.2);g.fillRect(x-4.2,y-20,8.4,2.8);
 g.beginPath();g.arc(x,y-57.4,3.6,0,7);g.fill();
 drawRR(g,x-9,y-76,18,20,4,lit?'#ffe9a0':'#4b5566');
 g.strokeStyle='#262b33';g.lineWidth=1.4;

function questStep(id,extra){const q=Q[id],def=QUESTS.find(x=>x.id===id);if(q.st!=='active')return;updateTicker();q.step++;
 if(q.step>=def.steps.length){q.st='done';toast('\ud83c\udf85 '+def.title+' \u2013 ABGESCHLOSSEN!'+(def.main?'':''));beep(880,0.3,'triangle');setTimeout(()=>beep(1170,0.4,'triangle'),180);checkWin()}else{toast('\ud83d\udcdd N\u00e4chster Schritt: '+def.steps[q.step].slice(0,60)+'\u2026');if(extra)extra()}}
function finQ(id){const def=QUESTS.find(q=>q.id===id);if(Q[id].st==='active'){Q[id].step=def.steps.length-1;questStep(id)}}
function checkWin(){const main=QUESTS.filter(q=>q.main);if(main.every(q=>Q[q.id].st==='done')){G.screen='win';beep(660,.2);setTimeout(()=>beep(880,.2),200);setTimeout(()=>beep(1320,.5),400)}}
function handInPostkasten(){let did=false;
 if(Q.zettel.st==='active'&&Q.zettel.step>=1&&inv.wunschzettel>=5){inv.wunschzettel-=5;questStep('zettel');did=true}
 if(Q.brief.st==='active'&&Q.brief.step>=2&&inv.brief>=1){inv.brief--;questStep('brief');did=true}
 if(!did)toast('\ud83d\udceb Hier kannst du deine Wunschzettel (5 St\u00fcck) oder den Weihnachtsbrief einwerfen.')}
function updateNPCs(dt){const ts=Math.min(15,Math.max(1,G.speed|0));for(const n of NPCs){if(n.map!==G.map)continue;if(n.name==='Streunerkatze Mimi'&&G.flags.katzeZahm)continue;n.alert=Math.max(0,n.alert-dt*2);
 const feast=day()>=24&&!isNight()&&n.map==='haus_eg'&&n.kind==='human';
 const night=isNight()&&MAPS[n.map].indoor;
 if(n.name==='Kater Murr'&&G.katzeSleep>0){n.sleeping=true}else n.sleeping=night;
 if(feast){const t=FEAST[n.name]||{x:560,y:420};n.x=t.x;n.y=t.y;n.walk+=dt*ts*8;continue}
 if(night||n.sleeping){n.walk+=dt*ts*8;continue}
 if(!n.pts)continue;const p=n.pts[n.pi],dx=p[0]-n.x,dy=p[1]-n.y,d=Math.hypot(dx,dy);
 if(d<4){n.pi=(n.pi+1)%n.pts.length}else{const st=n.spd*ts*dt/d;const nx=clamp(n.x+dx*st,20,MAPS[n.map].w-20),ny=clamp(n.y+dy*st,20,MAPS[n.map].h-20);if(!collAt(n.map,nx,ny)){n.x=nx;n.y=ny}else{if(!collAt(n.map,nx,n.y))n.x=nx;else if(!collAt(n.map,n.x,ny))n.y=ny;else n.pi=(n.pi+1)%n.pts.length}n.walk+=dt*ts*8}}}

 if(MAPS[G.map].indoor&&!isNight()){const px=G.px-cam.x,py=G.py-cam.y;ctx.save();const gr=ctx.createRadialGradient(px,py,6,px,py,90);gr.addColorStop(0,'rgba(255,228,160,.18)');gr.addColorStop(1,'rgba(255,228,160,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.restore()}
 ctx.restore();drawHUD();if(mapOn)drawMapLive();if(!MAPS[G.map].indoor)drawSnowfall();
 if(G.screen==='win'||G.screen==='lose'){ctx.fillStyle='rgba(6,10,22,.85)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  if(G.screen==='win'){ctx.fillStyle='#ffd98a';ctx.font='bold 40px sans-serif';ctx.fillText('\ud83c\udf85 Frohe Weihnachten, Berndt!',W/2,250);ctx.fillStyle='#cfe0ff';ctx.font='16px sans-serif';ctx.fillText('Alle Hauptquests geschafft \u2013 das Dorf erstrahlt, die Orgel klingt, die W\u00fcnsche sind auf dem Weg.',W/2,300)}
  else{ctx.fillStyle='#ff8a7a';ctx.font='bold 40px sans-serif';ctx.fillText('\ud83d\ude31 Erwischt \u2013 oder die Zeit ist um!',W/2,250);ctx.fillStyle='#cfe0ff';ctx.font='16px sans-serif';ctx.fillText(G.loseWhy||'',W/2,300)}
  ctx.fillStyle='#ffd98a';ctx.font='15px sans-serif';ctx.fillText('ENTER \u2013 Neues Spiel \u21bb | Lade deinen Spielstand mit \ud83d\udcc2 wieder (falls gespeichert)',W/2,360);ctx.textAlign='left'}}
let cam={x:0,y:0};
function startNew(){for(const k in inv)inv[k]=0;for(const q in Q){Q[q].st='offer';Q[q].step=0}
 G={screen:'intro',introT:0,time:0,speed:1,susp:0,map:'dorf',px:1080,py:472,walk:0,flags:{collected:[]},katzeSleep:0,portalCd:0};
 buildWorld();initNPCs2();document.getElementById('questPanel').style.display='none'}
function saveObj(){return {v:1,time:G.time,speed:G.speed,susp:G.susp,map:G.map,px:G.px,py:G.py,walk:G.walk,flags:G.flags,katzeSleep:G.katzeSleep,quest:JSON.parse(JSON.stringify(Q)),inv:Object.assign({},inv),collectd:null,collected:G.flags.collected}}
function applySave(d){startNew();G.time=d.time;G.speed=d.speed;if(!SPEEDS.includes(G.speed))G.speed=1;G.susp=d.susp;G.map=d.map;G.px=d.px;G.py=d.py;G.walk=d.walk||0;G.flags=d.flags;G.flags.collected=d.flags.collected||[];G.katzeSleep=d.katzeSleep||0;
 Object.assign(Q,d.quest);for(const k in d.inv)inv[k]=d.inv[k];buildWorld();
 const col=new Set([].concat(G.flags.collected,d.collected||[]));
 for(const mm in MAPS)MAPS[mm].items=MAPS[mm].items.filter(i=>!col.has(i.rid));
 clearCaches();G.screen='play';if(window)toast('\ud83d\udcbe Spielstand geladen!')}
function clearCaches(){for(const m in MAPS){MAPS[m].cacheDrawn=false}}
function drawQuestHint(){const act=QUESTS.find(q=>Q[q.id].st==='active');if(!act)return;const s=Q[act.id].step;
 const txt=(act.main?'[HAUPT] ':'[Neben] ')+act.title+' \u2013 Schritt '+(s+1)+': '+act.steps[Math.min(s,act.steps.length-1)];
 ctx.font='bold 13px sans-serif';const maxW=620,words=txt.split(' ');let lines=[''],li=0;
 for(const wd of words){const test=lines[li]+(lines[li]?' ':'')+wd;if(ctx.measureText(test).width>maxW-28&&lines[li]){li++;lines[li]=wd}else lines[li]=test}
 if(lines.length>3){lines=lines.slice(0,3);lines[2]+='\u2026'}
 let bw=10;lines.forEach(l=>bw=Math.max(bw,ctx.measureText(l).width));bw=Math.min(bw+30,maxW);
 drawRR(ctx,10,118,bw,lines.length*15+14,8,'rgba(10,18,34,.72)','#8a6a2a');ctx.fillStyle='#ffe9b0';
 lines.forEach((l,i)=>ctx.fillText(l,24,133+i*15))}
document.getElementById('btnSpeed').onclick=()=>{const i=(SPEEDS.indexOf(G.speed)+1)%3;G.speed=SPEEDS[i];document.getElementById('btnSpeed').textContent='\u23e9 Zeit \u00d7'+G.speed;toast('Zeitfaktor: \u00d7'+G.speed+(G.speed>1?' \u2013 NPCs laufen auch schneller!':''))};
document.getElementById('btnSave').onclick=()=>{const blob=new Blob([JSON.stringify(saveObj(),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='berndt_spielstand.json';a.click();toast('\ud83d\udcbe Spielstand als Datei gespeichert (Downloads-Ordner)')};
document.getElementById('btnLoad').onclick=()=>document.getElementById('loadfile').click();
document.getElementById('loadfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{applySave(JSON.parse(t))}catch(err){toast('\u274c Keine g\u00fcltige Spielstands-Datei.')}})};
setInterval(()=>{if(G.screen==='play')try{localStorage.setItem('berndt_autosave',JSON.stringify(saveObj()))}catch(e){}},10000);
addEventListener('beforeunload',()=>{if(G.screen==='play')try{localStorage.setItem('berndt_auto','1');localStorage.setItem('berndt_autosave',JSON.stringify(saveObj()))}catch(e){}});
addEventListener('keydown',e=>{if(e.key==='Enter'){if(G.screen==='title'||G.screen==='win'||G.screen==='lose')startNew()}
 if(e.key.toLowerCase()==='l'&&G.screen==='title'){try{const d=localStorage.getItem('berndt_autosave');if(d){applySave(JSON.parse(d))}else toast('Kein Auto-Save gefunden \u2013 dr\u00fccke ENTER f\u00fcr ein neues Spiel.')}catch(err){}}});
let loopLast=performance.now();
let loopGuard='';
function loop(){try{const now=performance.now();let dt=Math.min(0.05,(now-loopLast)/1000);loopLast=now;if(!isFinite(dt)||dt<0)dt=0;
 if(keys['e']){}if(G.screen==='intro'){G.introT=(G.introT||0)+dt;if(G.introT>=10&&!G.introRoof){G.introRoof={x:30,y:386,vy:0,dead:0,deadT:0,done:false,last:0}}
 if(G.introRoof&&G.introRoof.done)finishIntro()}update(dt);updateTicker();render();if(G.screen==='play'&&isNight()){ctx.save();ctx.translate(G.px-cam.x,G.py-cam.y);drawElf(ctx,0,0,G.walk||0);ctx.restore()}requestAnimationFrame(loop)}catch(err){loopGuard=String(err&&err.message||err);console.error(err);requestAnimationFrame(loop)}}
buildRuntime();initSnow();loopLast=0;requestAnimationFrame(loop);
